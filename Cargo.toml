[package]
name = "fireworks"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["native"]
# Linux window backends (omit when building for wasm).
native = ["bevy/x11", "bevy/wayland"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "ui",
    "web",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
] }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

# Fast runtime even in dev builds (bevy is unusably slow unoptimized)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
